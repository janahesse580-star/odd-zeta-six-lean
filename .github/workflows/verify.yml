name: Verify Proof

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-python-certificate:
    name: Verify Python/FLINT/Arb Certificate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python-flint
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run static certificate verifier
        run: python verify_zeta6_certificate.py

  verify-lean4-proof:
    name: Verify Lean 4 Formalization & Axiom Audit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Static scan for sorry / native_decide / custom axiom
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys
          root = pathlib.Path("lean")
          files = [root / "OddZetaSix.lean"] + sorted((root / "OddZetaSix").rglob("*.lean"))
          hits = []
          for f in files:
              txt = f.read_text(encoding="utf-8")
              clean = re.sub(r"/-.*?-/", "", txt, flags=re.S)
              clean = re.sub(r"--.*", "", clean)
              for pat in [r"\bsorry\b", r"\bnative_decide\b", r"^\s*axiom\b", r"\badmit\b"]:
                  for m in re.finditer(pat, clean, flags=re.M):
                      hits.append((str(f), pat, m.group(0)))
          if hits:
              print("FORBIDDEN TOKENS FOUND:", hits, file=sys.stderr)
              sys.exit(1)
          print(f"Static scan PASSED across {len(files)} Lean files: 0 sorry, 0 native_decide, 0 custom axiom.")
          EOF

      - name: Install elan & pinned Lean 4 toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Fetch Mathlib olean cache
        working-directory: lean
        run: |
          lake exe cache get

      - name: Build OddZetaSix.AxiomAudit and OddZetaSix sequentially
        working-directory: lean
        run: |
          lake build OddZetaSix.AxiomAudit
          lake build OddZetaSix
